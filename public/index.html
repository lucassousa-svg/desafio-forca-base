<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operação Base Forte — GestãoClick</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#001636;--red:#CC0000;--blue:#0268CD;--bg:#f4f6f9;--sf:#fff;--sf2:#f0f2f6;--bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.15);--tx:#0d1117;--mu:#6b7280;--fa:#9ca3af;--r:10px;--rl:14px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:1.25rem 1rem 4rem}
.wrap{max-width:1180px;margin:0 auto}
button{font-family:'Inter',sans-serif;cursor:pointer}
.adm{display:none!important}
body.admin .adm{display:inline-flex!important}
body.admin .adm-b{display:block!important}
/* hero */
.hero{background:var(--dark);border-radius:var(--rl);padding:1.25rem 1.5rem 1rem;position:relative;overflow:hidden;margin-bottom:14px}
.hero::before{content:'';position:absolute;top:-50px;right:-40px;width:220px;height:220px;background:var(--red);opacity:.08;border-radius:50%}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:8px}
h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;color:#fff;line-height:1.2}
.sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cd{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.6)}
.cd b{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.cd b.urg{color:#FF7B7B;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bt{font-size:13px;padding:8px 14px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bt:hover{background:var(--sf2)}
.bt.red,.bt.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.bt.red:hover,.bt.pri:hover{background:#aa0000}
.bt.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.bt.ghost:hover{background:rgba(255,255,255,.16)}
.bt.dng{background:#CC0000;border-color:#CC0000;color:#fff;font-weight:600}
.bt:disabled{opacity:.5;cursor:not-allowed}
.mini{font-size:11px;padding:4px 9px;border:.5px solid var(--bd2);border-radius:var(--r);background:transparent;color:var(--mu);align-items:center;gap:4px}
.mini:hover{background:var(--sf2)}
.mini.gr:hover{background:#EAF3DE;color:#27500A;border-color:#27500A}
.mini.rd:hover{background:#FAECE7;color:#712B13;border-color:#712B13}
.motiv{margin-top:12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:var(--r);padding:9px 14px;color:#fff;font-size:13px;font-style:italic;position:relative}
.motiv i{color:rgba(255,255,255,.55);font-size:16px}
.motiv span{flex:1}
.motiv .mini{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3);font-style:normal}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.hero-right{align-items:flex-start}.hbtns{justify-content:flex-start}}
.card{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:14px 16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ct{font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.cs{font-size:12px;color:var(--fa)}
.side{display:flex;flex-direction:column;gap:14px}
/* podium */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 12px}
.pc{display:flex;flex-direction:column;align-items:center;gap:3px;width:30%;max-width:150px}
.pc .nm{font-size:12px;font-weight:500;text-align:center}
.pb{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700}
.crown{font-size:20px;color:#C8950A;animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px)}}
/* ranking */
.rw{display:grid;grid-template-columns:30px 36px minmax(0,1fr) minmax(56px,100px) 138px;align-items:center;gap:10px;padding:10px 4px;border-top:.5px solid var(--bd);transition:background .15s}
.rw:hover{background:var(--sf2)}
.rn{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:var(--fa);text-align:center}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;flex-shrink:0}
.av.s{width:28px;height:28px;font-size:10px}
.av-jane{background:#E6F1FB;color:#0C447C}.av-lucas{background:#EAF3DE;color:#27500A}.av-ana{background:#FAECE7;color:#712B13}.av-larissa{background:#EEEDFE;color:#3C3489}.av-arthur{background:#FEF0E6;color:#93340A}.av-breno{background:#DDEEDD;color:#145214}.av-evelyn{background:#EDE0F5;color:#5B2D8E}
.pn{font-size:14px;font-weight:500}
.pa{font-size:11px;color:var(--mu);background:var(--sf2);padding:1px 7px;border-radius:9px;display:inline-block;margin-top:2px}
.pt{font-size:11px;color:var(--red);font-weight:500;display:block;margin-top:2px}
.bar{height:6px;background:var(--sf2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .8s ease}
.b-jane{background:#378ADD}.b-lucas{background:#639922}.b-ana{background:#D85A30}.b-larissa{background:#7F77DD}.b-arthur{background:#E8720C}.b-breno{background:#2D8A2D}.b-evelyn{background:#9B59D0}
.pp{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}
.pv{display:inline-flex;align-items:baseline;gap:3px}
.pp b{font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pp small{font-size:11px;color:var(--fa)}
.pt{line-height:1.4}
@media(max-width:560px){.rw{grid-template-columns:24px 32px minmax(0,1fr) auto}.rw .bar{display:none}}
/* side cards */
.big{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.mu{font-size:12px;color:var(--mu)}
.prog{height:9px;background:var(--sf2);border-radius:5px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.st{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;display:inline-block;margin-top:6px}
.st.ok{background:#EAF3DE;color:#27500A}.st.wn{background:#FEF3C7;color:#92400E}.st.rk{background:#FAECE7;color:#712B13}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kc{background:var(--sf2);border-radius:var(--r);padding:8px 10px}
.kc span{display:block;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc b{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700}
.kc b.t1{color:#CC0000}.kc b.t2{color:#E8720C}
.msel{width:100%;font-size:12px;padding:6px 8px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);font-family:'Inter',sans-serif;margin-bottom:10px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.tab{font-size:13px;padding:7px 14px;border:.5px solid var(--bd2);border-radius:20px;background:var(--sf);color:var(--mu);display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--sf2)}
.tab.on{background:var(--dark);border-color:var(--dark);color:#fff}
.cnt{font-size:11px;padding:0 7px;border-radius:10px;background:var(--red);color:#fff;font-weight:600}
.panel{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:6px 16px}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--bd);font-size:13px;flex-wrap:wrap}
.it:first-child{border-top:none}
.it .grow{flex:1;min-width:150px}
.it small{display:block;font-size:11px;color:var(--mu)}
.it .why{color:#CC0000}
.ip{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;white-space:nowrap}
.lk{font-size:11px;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.lk:hover{text-decoration:underline}
.dt{font-size:11px;color:var(--fa);white-space:nowrap}
.dup{font-size:10px;padding:2px 8px;border-radius:10px;background:#FEF3C7;color:#92400E;border:.5px solid #F59E0B;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.dupr{background:#FFFBEB;margin:0 -16px;padding-left:16px;padding-right:16px}
.empty{font-size:13px;color:var(--fa);padding:22px 0;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 4px}
.pill{font-size:11px;padding:4px 10px;border:.5px solid var(--bd2);border-radius:20px;background:var(--sf);color:var(--mu)}
.pill.on{background:var(--dark);color:#fff;border-color:var(--dark)}
/* pontos */
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:14px 0}
.li{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:10px}
.li.t1{border:1.5px solid #CC0000}.li.t1 .ln{color:#CC0000}
.li.t2{border:1px solid #E8720C}.li.t2 .ln{color:#E8720C}
.le{font-size:20px;display:inline-block}
.li.t1 .le{animation:p1 1.8s ease-in-out infinite}
.li.t2 .le{animation:p2 2.2s ease-in-out infinite}
@keyframes p1{50%{transform:scale(1.25);filter:drop-shadow(0 0 6px rgba(204,0,0,.5))}}
@keyframes p2{50%{transform:scale(1.2) rotate(-8deg);filter:drop-shadow(0 0 5px rgba(232,114,12,.45))}}
.lt b{font-size:13px;font-weight:500;display:block}.lt span{font-size:11px;color:var(--mu)}
.lp{margin-left:auto;text-align:right}.ln{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--dark);line-height:1}.lp small{font-size:10px;color:var(--fa)}
/* receita diaria */
.dr{display:grid;grid-template-columns:56px minmax(0,1fr) 110px auto;align-items:center;gap:10px;padding:9px 0;border-top:.5px solid var(--bd);font-size:13px}
.dr:first-of-type{border-top:none}
/* weeks */
details{border-top:.5px solid var(--bd)}details:first-child{border-top:none}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary b{font-family:'Outfit',sans-serif;font-size:14px;font-weight:600}
.champ{display:flex;align-items:center;gap:10px;background:var(--dark);border-radius:var(--r);padding:9px 12px;margin-bottom:8px;color:#fff}
.champ b{font-family:'Outfit',sans-serif;font-size:14px}.champ span{font-size:12px;color:rgba(255,255,255,.6)}
.wr{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:.5px solid var(--bd);font-size:13px}
/* modal + toasts */
.mo{display:none;position:fixed;inset:0;background:rgba(0,10,30,.5);align-items:center;justify-content:center;z-index:200;padding:12px}
.mo.open{display:flex}
.mdl{background:var(--sf);border-radius:var(--rl);padding:1.5rem;width:420px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.mdl h2{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:4px}
.mdl p.ms{font-size:13px;color:var(--mu);margin-bottom:14px}
.mdl label{font-size:12px;color:var(--mu);display:block;margin:6px 0 3px}
.mdl input,.mdl select,.mdl textarea{width:100%;font-size:14px;font-family:'Inter',sans-serif;border:.5px solid var(--bd2);border-radius:var(--r);padding:9px 12px;background:var(--sf);color:var(--tx);outline:none;margin-bottom:6px}
.mdl input:focus,.mdl select:focus,.mdl textarea:focus{border-color:var(--blue)}
.mdl textarea{resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.warn{font-size:12px;color:#92400E;background:#FEF3C7;border:.5px solid #F59E0B;border-radius:var(--r);padding:6px 10px;margin-bottom:8px}
.ops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.op{padding:9px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--sf2);font-size:13px;color:var(--tx)}
.op.on{border-color:var(--blue);background:#E6F1FB;color:#0C447C}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1}
.otoast{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .4s;z-index:1000;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.otoast.show{opacity:1}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="badge"><i class="ti ti-bolt"></i> Desafio ativo</div>
        <h1>Operação Base Forte</h1>
        <div class="sub">Desafio Força da Base · ranking em tempo real</div>
      </div>
      <div class="hero-right">
        <div class="cd"><i class="ti ti-clock"></i><span>Semana encerra em</span><b id="cd">--</b></div>
        <div class="hbtns">
          <button class="bt red" onclick="openReg()"><i class="ti ti-plus"></i> Registrar ação</button>
          <button class="bt ghost" onclick="load(true)" aria-label="Atualizar dados"><i class="ti ti-refresh" id="rfi"></i></button>
          <button class="bt ghost" id="lockbtn" onclick="lockClick()"><i class="ti ti-lock" id="locki"></i> <span id="lockt">Gestor</span></button>
        </div>
      </div>
    </div>
    <div class="motiv"><i class="ti ti-speakerphone"></i><span id="motiv">Bora, time! Cada ação conta. 🚀</span><button class="mini adm" onclick="openMotiv()"><i class="ti ti-pencil"></i> Editar</button></div>
  </header>

  <div class="main">
    <section class="card">
      <div class="ch">
        <div><div class="ct"><i class="ti ti-trophy"></i> Ranking da semana</div><div class="cs" id="rsub"></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="mini adm" onclick="openZero()"><i class="ti ti-trash"></i> Zerar hoje</button>
          <button class="mini adm" style="color:#CC0000;border-color:#CC0000" onclick="openWeek()"><i class="ti ti-flag"></i> Encerrar semana</button>
          <button class="mini adm" style="color:#7F77DD;border-color:#7F77DD" onclick="openMonth()"><i class="ti ti-calendar-event"></i> Encerrar mês</button>
        </div>
      </div>
      <div class="pod" id="pod"></div>
      <div id="rk"><div class="empty"><i class="ti ti-loader spin"></i> Carregando...</div></div>
    </section>
    <aside class="side" id="side"></aside>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="panel"></section>
</div>

<div class="mo" id="mo"><div class="mdl"><h2 id="mt"></h2><p class="ms" id="ms"></p><div id="mb"></div><div class="mfoot"><button class="bt" onclick="closeM()">Cancelar</button><button class="bt pri" id="mok"></button></div></div></div>
<div class="otoast" id="ot"></div>
<div class="toast" id="tt"></div>

<script>
const ADMIN_PASS='2355';
const PL={
  jane:{n:'Jane',a:'camisa 10',i:'JA',g:'f'},lucas:{n:'Lucas Neiva',a:'Mineirinho',i:'LN',g:'m'},ana:{n:'Ana Luiza',a:'Incendiária',i:'AL',g:'f'},
  larissa:{n:'Larissa',a:'BOPE',i:'LA',g:'f'},arthur:{n:'Arthur',a:'Cocoricó',i:'AR',g:'m'},breno:{n:'Breno',a:'Sangue nos zói',i:'BR',g:'m'},evelyn:{n:'Evelyn',a:'Eve',i:'EV',g:'f'}
};
const ACT={
 '60':{e:'🔄',l:'Recuperação (50+ dias)',s:'Recuperação',d:'50+ dias atrasado',p:60,tier:1,t:['Mestre da Ressurreição','Mestra da Ressurreição']},
 '50':{e:'⚡',l:'Reativação (30+ dias)',s:'Reativação',d:'30+ dias atrasado',p:50,tier:2,t:['Caçador de Inativos','Caçadora de Inativos']},
 '40i':{e:'🤝',l:'Indicação gerada',s:'Indicação',d:'Cliente indicou outro',p:40,tier:2,t:['Embaixador','Embaixadora']},
 '40':{e:'⏫',l:'Upgrade de duração (mensal → anual)',s:'Upg. mensal→anual',d:'Mensal → Anual',p:40,tier:2,t:['Fidelizador','Fidelizadora']},
 '40k':{e:'💎',l:'Plano acima de R$6k',s:'Plano +6k',d:'Por contrato fechado',p:40,tier:2,t:'Ticket Premium'},
 '30':{e:'📈',l:'Upgrade de plano',s:'Upgrade de plano',d:'Bronze → Prata etc.',p:30,t:'Sobe Patente'},
 '30ts':{e:'⏫',l:'Upgrade de duração (trimestral → semestral)',s:'Upg. tri→sem',d:'Trimestral → Semestral',p:30,t:['Fidelizador','Fidelizadora']},
 '30sa':{e:'⏫',l:'Upgrade de duração (semestral → anual)',s:'Upg. sem→anual',d:'Semestral → Anual',p:30,t:['Fidelizador','Fidelizadora']},
 '30r':{e:'🛡️',l:'Retenção (churn)',s:'Retenção',d:'Cliente salvo',p:30,t:'Muralha'},
 '25u':{e:'➕',l:'Upsell add-on',s:'Upsell add-on',d:'Por cliente',p:25,t:['Rei dos Upsells','Rainha dos Upsells']},
 '20k':{e:'💎',l:'Plano acima de R$3k',s:'Plano +3k',d:'Por contrato fechado',p:20,t:'Ticket Alto'},
 '10a':{e:'📅',l:'Antecipação de renovação',s:'Antecipação',d:'Antes do vencimento',p:10,t:['Antecipador','Antecipadora']}
};
const LEG={'30u':['Upsell add-on',30,'25u'],'25':['Upsell add-on',25,'25u'],'20':['Retenção (churn)',20,'30r'],'18':['Renovação',18,null],'10':['Atividade comercial',10,null],'15':['Avaliação no Google',15,null]};
const UPG=['30','40','30ts','30sa'];

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?esc(String(u).trim()):'';
const brl=v=>'R$\u00a0'+Math.round(Number(v)||0).toLocaleString('pt-BR');
const num=v=>Math.round(Number(v)||0).toLocaleString('pt-BR');
const canon=k=>{k=String(k);return ACT[k]?k:(LEG[k]?LEG[k][2]:null)};
const ptsOf=k=>{k=String(k);return ACT[k]?ACT[k].p:(LEG[k]?LEG[k][1]:(parseInt(k)||0))};
const lbl=it=>it.label||(ACT[String(it.pts)]?ACT[String(it.pts)].l:(LEG[String(it.pts)]?LEG[String(it.pts)][0]:'Ação de '+ptsOf(it.pts)+' pts'));
const emo=it=>{const c=canon(it.pts);return c?ACT[c].e:'•'};
const hpts=h=>Number(h.resolvedPts)>0?Number(h.resolvedPts):ptsOf(h.pts);
const fdt=iso=>iso?new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const av=(k,s)=>`<div class="av ${s?'s ':''}av-${k}">${PL[k].i}</div>`;

function toast(m){const t=$('tt');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600)}
function otoast(m){const t=$('ot');t.textContent=m;t.classList.add('show');clearTimeout(oT);oT=setTimeout(()=>t.classList.remove('show'),4000)}
async function api(action,payload){const r=await fetch('/api/save-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});if(!r.ok){const e=new Error(r.status===404?'Essa ação já foi tratada.':'Erro ao salvar.');e.status=r.status;throw e}return r.json()}
const order=pts=>Object.keys(PL).sort((a,b)=>(Number(pts[b])||0)-(Number(pts[a])||0));

async function load(manual){
  if(manual)$('rfi').classList.add('spin');
  try{
    const r=await fetch('/api/get-data');if(!r.ok)throw new Error();
    const d=await r.json();
    const o=order(d.points||{});
    if(!first&&prevOrder.length)o.forEach((k,i)=>{const p=prevOrder.indexOf(k);if(p>i)otoast('🔺 '+PL[k].n+' ultrapassou '+PL[prevOrder[i]].n+'! 🔥')});
    prevOrder=o;
    S={...S,...d};S.metas={receita:0,time:0,...(d.metas||{})};
    if(d.motiv)$('motiv').textContent=d.motiv;
    if(manual)toast('Dados atualizados!');
  }catch(e){console.error(e);if(manual)toast('Não foi possível atualizar.')}
  $('rfi').classList.remove('spin');
  first=false;renderAll();
}

/* ---------- ranking ---------- */
/* Título exclusivo: fica com quem mais fez aquela modalidade na semana.
   Empate: leva quem chegou àquela quantidade primeiro. */
function weekTitles(){
  const g={};
  S.history.forEach(h=>{
    const c=canon(h.pts);if(!c||!PL[h.playerKey])return;
    const t=ACT[c].t,key=Array.isArray(t)?t[0]:t;
    const grp=g[key]=g[key]||{def:ACT[c],p:{}};
    const x=grp.p[h.playerKey]=grp.p[h.playerKey]||{n:0,at:0};
    x.n++;const ts=new Date(h.validatedAt).getTime()||0;if(ts>x.at)x.at=ts;
  });
  const out={};
  Object.values(g).forEach(grp=>{
    const c=Object.entries(grp.p).sort((a,b)=>b[1].n-a[1].n||a[1].at-b[1].at);
    if(!c.length)return;
    const k=c[0][0],v=c[0][1],t=grp.def.t;
    (out[k]=out[k]||[]).push({e:grp.def.e,txt:Array.isArray(t)?(PL[k].g==='f'?t[1]:t[0]):t,n:v.n,w:v.n*grp.def.p});
  });
  Object.keys(out).forEach(k=>out[k].sort((a,b)=>b.w-a.w||b.n-a.n));
  return out;
}
function rRank(){
  const pts=S.points||{},o=order(pts),max=Math.max(...o.map(k=>Number(pts[k])||0),1),tt=weekTitles();
  const tot=o.reduce((s,k)=>s+(Number(pts[k])||0),0);
  $('rsub').textContent=num(tot)+' pts · '+(S.validated||0)+' ações validadas';
  const H=[96,126,74],C=[['#F0F2F6','#444'],['#FAEEDA','#854F0B'],['#FAECE7','#712B13']],sl=[o[1],o[0],o[2]];
  $('pod').innerHTML=sl.map((k,i)=>`<div class="pc">${i===1?'<i class="ti ti-crown crown"></i>':''}${av(k)}<span class="nm">${PL[k].n.split(' ')[0]}</span><div class="pb" style="height:${H[i]}px;background:${C[i][0]};color:${C[i][1]}">${num(pts[k])}</div></div>`).join('');
  $('rk').innerHTML=o.map((k,i)=>{
    const p=PL[k],t=(tt[k]||[]).slice(0,2).map(x=>x.e+' '+x.txt).join(' · '),v=Number(pts[k])||0;
    return `<div class="rw"><div class="rn">${i+1}</div>${av(k)}<div style="min-width:0"><div class="pn">${p.n}</div><span class="pa">${esc(p.a)}</span>${t?`<span class="pt">${t}</span>`:''}</div><div class="bar"><i class="b-${k}" style="width:${Math.round(v/max*100)}%"></i></div><div class="pp"><span class="pv"><b>${num(v)}</b><small>pts</small></span><button class="mini adm" onclick="openEdit('${k}')" aria-label="Editar pontos de ${p.n}"><i class="ti ti-pencil"></i></button></div></div>`;
  }).join('');
}

/* ---------- lateral ---------- */
function bd(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),t=new Date(y,m+1,0).getDate();let u=0,c=0;for(let d=1;d<=t;d++){const w=new Date(y,m,d).getDay();if(w!==0&&w!==6){u++;if(d<=n.getDate())c++}}return{u,c:Math.max(c,1)}}
function monthCounts(){
  const c={},add=h=>{const k=canon(h.pts);if(k)c[k]=(c[k]||0)+1},n=new Date();
  S.history.forEach(add);
  S.weeks.forEach(w=>{if(!w.closedAt)return;const d=new Date(w.closedAt);if(d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear())(w.history||[]).forEach(add)});
  return c;
}
function snapCounts(raw){const c={};Object.entries(raw||{}).forEach(([k,v])=>{const ck=canon(k);if(ck)c[ck]=(c[ck]||0)+Number(v)});return c}
function modGrid(c){return `<div class="g2">${Object.keys(ACT).map(k=>`<div class="kc"><span>${ACT[k].e} ${ACT[k].s}</span><b class="${ACT[k].tier===1?'t1':ACT[k].tier===2?'t2':''}">${c[k]||0}</b></div>`).join('')}</div>`}
function recCard(rec,meta,label,snap){
  const pr=snap?rec:rec*bd().u/bd().c,pc=meta>0?Math.round(pr/meta*100):0;
  const cls=pc>=90?'ok':pc>=60?'wn':'rk',tx=snap?(pc>=90?'Atingido':pc>=60?'Parcial':'Não atingido'):(pc>=90?'No caminho':pc>=60?'Atenção':'Em risco');
  const col=pc>=90?'#639922':pc>=60?'#E8720C':'#CC0000';
  return `<div class="card"><div class="ch" style="margin-bottom:6px"><div class="ct"><i class="ti ti-currency-dollar"></i> Receita · ${esc(label)}</div><button class="mini adm" onclick="openMetas()"><i class="ti ti-pencil"></i> Metas</button></div>
  <div class="big">${brl(rec)}</div><div class="mu">meta: ${brl(meta)}</div>
  <div class="prog"><i style="width:${Math.min(100,meta>0?Math.round(rec/meta*100):0)}%;background:${col}"></i></div>
  ${snap?`<div class="mu">${pc}% da meta</div>`:`<div class="mu">Projeção: ${brl(pr)} · ${pc}%</div>`}${meta>0?`<span class="st ${cls}">${tx}</span>`:''}</div>`;
}
function rSide(){
  const mh=S.monthHistory||[],sel=selMonth!=='cur'&&mh[selMonth]?mh[selMonth]:null;
  let h=`<select class="msel" onchange="pickMonth(this.value)" aria-label="Escolher mês"><option value="cur">Mês atual</option>${mh.map((m,i)=>`<option value="${i}"${sel&&String(selMonth)===String(i)?' selected':''}>${esc(m.label)}</option>`).join('')}</select>`;
  if(sel){
    h+=recCard(Number(sel.receita)||0,Number(sel.meta)||0,sel.label,true);
    h+=`<div class="card"><div class="ct" style="margin-bottom:10px"><i class="ti ti-stack-2"></i> Ações por modalidade</div>${modGrid(snapCounts(sel.counts))}</div>`;
    const rk=sel.ranking||[];
    if(rk.length)h+=`<div class="card"><div class="ct" style="margin-bottom:6px"><i class="ti ti-trophy"></i> Ranking do mês</div>${rk.filter(r=>PL[r.key]).map((r,i)=>`<div class="wr">${['🥇','🥈','🥉'][i]||'<span class="rn" style="width:22px;display:inline-block">'+(i+1)+'</span>'}${av(r.key,1)}<span style="flex:1">${PL[r.key].n}</span><b class="ip">${num(r.pts)} pts</b></div>`).join('')}</div>`;
    $('side').innerHTML=h;return;
  }
  const pts=S.points||{},tot=Object.keys(PL).reduce((s,k)=>s+(Number(pts[k])||0),0),mt=Number(S.metas.time)||0,mc=monthCounts();
  const rec=(S.dailyHistory||[]).reduce((s,d)=>s+Number(d.receita||0),0);
  h+=`<div class="card"><div class="ch" style="margin-bottom:6px"><div class="ct"><i class="ti ti-target-arrow"></i> Meta do time</div><button class="mini adm" onclick="openMetas()"><i class="ti ti-pencil"></i> Meta</button></div>
  <div class="big">${num(tot)}</div><div class="mu">${mt>0?'meta: '+num(mt)+' pts na semana':'Meta ainda não definida'}</div>
  ${mt>0?`<div class="prog"><i style="width:${Math.min(100,Math.round(tot/mt*100))}%;background:#639922"></i></div><div class="mu">${tot>=mt?'Meta batida! 🎉':'Faltam '+num(mt-tot)+' pts'}</div>`:''}</div>`;
  h+=recCard(rec,Number(S.metas.receita)||0,mname(),false);
  h+=`<div class="card"><div class="ct" style="margin-bottom:10px"><i class="ti ti-chart-bar"></i> No mês</div><div class="g2" style="margin-bottom:10px"><div class="kc"><span>➕ Upsells</span><b>${mc['25u']||0}</b></div><div class="kc"><span>📈 Upgrades</span><b>${UPG.reduce((s,k)=>s+(mc[k]||0),0)}</b></div></div>${modGrid(mc)}</div>`;
  $('side').innerHTML=h;
}

/* ---------- abas ---------- */
const TABS=[['pend','Pendentes'],['hist','Histórico'],['den','Negadas'],['pts','Pontos'],['rec','Receita diária'],['wk','Semanas'],['mo','Meses']];
function setTab(k){tab=k;rTabs();rPanel()}
function rTabs(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab${tab===k?' on':''}" onclick="setTab('${k}')">${l}${k==='pend'&&S.pending.length?`<span class="cnt">${S.pending.length}</span>`:''}</button>`).join('')}
function linkH(l){const u=safeUrl(l);return u?`<a class="lk" href="${u}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> link</a>`:'<span class="dt">sem link</span>'}
function allLinks(){const a=[];S.history.forEach(h=>a.push({l:h.link,k:h.playerKey,w:fdt(h.validatedAt),id:h.id}));S.weeks.forEach(w=>(w.history||[]).forEach(h=>a.push({l:h.link,k:h.playerKey,w:fdt(h.validatedAt),id:h.id})));S.pending.forEach(p=>a.push({l:p.link,k:p.playerKey,w:'pendente',id:p.id}));return a}
function dupOf(it){const l=(it.link||'').trim();if(!l)return null;return allLinks().find(x=>(x.l||'').trim()===l&&x.id!==it.id)||null}
function rPanel(){
  let h='';
  if(tab==='pend'){
    h=S.pending.length?S.pending.map(it=>{
      if(!PL[it.playerKey])return '';
      const d=admin?dupOf(it):null;
      return `<div class="it${d?' dupr':''}">${av(it.playerKey,1)}<div class="grow"><b style="font-weight:500">${PL[it.playerKey].n}</b><small>${emo(it)} ${esc(lbl(it))}</small></div>${d?`<span class="dup"><i class="ti ti-alert-triangle"></i> Duplicado · ${PL[d.k]?PL[d.k].n:''}</span>`:''}${linkH(it.link)}<span class="ip">+${ptsOf(it.pts)} pts</span>
      <button class="mini gr adm" onclick="validate('${esc(it.id)}')"><i class="ti ti-check"></i> Validar</button><button class="mini rd adm" onclick="openDeny('${esc(it.id)}')"><i class="ti ti-x"></i> Negar</button><button class="mini adm" onclick="delPending('${esc(it.id)}')" aria-label="Excluir"><i class="ti ti-trash"></i></button>${admin?'':'<span class="dt">aguardando validação</span>'}</div>`}).join(''):'<div class="empty"><i class="ti ti-checks" style="font-size:24px;display:block;margin-bottom:6px"></i>Nenhuma ação pendente.</div>';
  }
  if(tab==='hist'){
    const items=S.history.filter(x=>hFilter==='all'||x.playerKey===hFilter);
    h=`<div class="pills"><button class="pill${hFilter==='all'?' on':''}" onclick="setF('all')">Todos</button>${Object.keys(PL).map(k=>`<button class="pill${hFilter===k?' on':''}" onclick="setF('${k}')">${PL[k].n.split(' ')[0]}</button>`).join('')}</div>`+
    (items.length?items.map(x=>PL[x.playerKey]?`<div class="it">${av(x.playerKey,1)}<div class="grow"><b style="font-weight:500">${PL[x.playerKey].n}</b><small>${emo(x)} ${esc(lbl(x))}</small></div>${linkH(x.link)}<span class="ip">+${hpts(x)} pts</span><span class="dt">${fdt(x.validatedAt)}</span><button class="mini adm" onclick="delHist('${esc(x.id)}')" aria-label="Excluir e estornar"><i class="ti ti-trash"></i></button></div>`:'').join(''):'<div class="empty">Nenhuma ação encontrada.</div>');
  }
  if(tab==='den'){
    h=S.denied.length?S.denied.map(x=>PL[x.playerKey]?`<div class="it">${av(x.playerKey,1)}<div class="grow"><b style="font-weight:500">${PL[x.playerKey].n}</b><small>${emo(x)} ${esc(lbl(x))}</small>${x.reason?`<small class="why">Motivo: ${esc(x.reason)}</small>`:''}</div>${linkH(x.link)}<span class="dt">${fdt(x.deniedAt)}</span></div>`:'').join(''):'<div class="empty">Nenhuma ação negada.</div>';
  }
  if(tab==='pts'){
    h=`<div class="lg">${Object.keys(ACT).map(k=>`<div class="li${ACT[k].tier?' t'+ACT[k].tier:''}"><span class="le">${ACT[k].e}</span><div class="lt"><b>${ACT[k].s}</b><span>${ACT[k].d}</span></div><div class="lp"><div class="ln">${ACT[k].p}</div><small>pts</small></div></div>`).join('')}</div>`;
  }
  if(tab==='rec'){
    const d=(S.dailyHistory||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),mx=Math.max(...d.map(x=>Number(x.receita)||0),1);
    h=`<div style="padding:12px 0 4px"><button class="mini adm" onclick="openDay()"><i class="ti ti-plus"></i> Registrar dia</button></div>`+(d.length?d.map(x=>`<div class="dr"><span class="mu">${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span><div class="bar"><i style="width:${Math.round((Number(x.receita)||0)/mx*100)}%;background:#0268CD"></i></div><b class="ip" style="text-align:right">${brl(x.receita)}</b><button class="mini adm" onclick="delDay('${esc(x.date)}')" aria-label="Remover dia"><i class="ti ti-trash"></i></button></div>`).join(''):'<div class="empty">Nenhum dia registrado ainda.</div>');
  }
  if(tab==='wk'){
    h=S.weeks.length?S.weeks.map(w=>{
      const p=w.points||{},o=order(p),c=o[0],d=w.closedAt?new Date(w.closedAt).toLocaleDateString('pt-BR'):'';
      return `<details><summary><div><b>${esc(w.label||'Semana encerrada')}</b><div class="mu">🏆 ${PL[c].n} · ${w.validated||0} ações · ${d}</div></div><i class="ti ti-chevron-down"></i></summary><div class="champ"><span style="font-size:20px">🏆</span>${av(c,1)}<div><b>${PL[c].n}</b><br><span>${num(p[c])} pts · campeão(ã) da semana</span></div></div>${o.map((k,i)=>`<div class="wr"><span style="width:24px;text-align:center">${['🥇','🥈','🥉'][i]||i+1}</span>${av(k,1)}<span style="flex:1">${PL[k].n}</span><b class="ip">${num(p[k])} pts</b></div>`).join('')}<div style="height:8px"></div></details>`}).join(''):'<div class="empty">Nenhuma semana encerrada ainda.</div>';
  }
  if(tab==='mo'){
    const m=S.monthHistory||[];
    h=m.length?m.map((x,i)=>{const r=(x.ranking||[]).filter(q=>PL[q.key])[0];return `<div class="it"><i class="ti ti-calendar-event" style="font-size:20px;color:#7F77DD"></i><div class="grow"><b style="font-weight:500">${esc(x.label)}</b><small>${r?'🏆 '+PL[r.key].n+' · '+num(r.pts)+' pts · ':''}${brl(x.receita)} de ${brl(x.meta)}</small></div><button class="mini" onclick="viewMonth(${i})"><i class="ti ti-eye"></i> Ver no painel</button></div>`}).join(''):'<div class="empty">Nenhum mês encerrado ainda.</div>';
  }
  $('panel').innerHTML=h;
}
function setF(k){hFilter=k;rPanel()}

/* ---------- modais ---------- */
function modal(title,sub,body,ok,fn,cls){
  $('mt').textContent=title;$('ms').innerHTML=sub||'';$('mb').innerHTML=body;
  const b=$('mok');b.innerHTML=ok;b.className='bt '+(cls||'pri');
  b.onclick=async()=>{b.disabled=true;try{const r=await fn();if(r!==false)closeM()}catch(e){toast(e.message||'Erro.')}b.disabled=false};
  $('mo').classList.add('open');
  const f=$('mb').querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),30);
  $('mb').querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()}));
}
function closeM(){$('mo').classList.remove('open')}
$('mo').addEventListener('click',e=>{if(e.target===$('mo'))closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const done=async(msg)=>{toast(msg);await load()};

function lockClick(){
  if(admin){admin=false;document.body.classList.remove('admin');$('locki').className='ti ti-lock';$('lockt').textContent='Gestor';renderAll();toast('Modo gestor desativado');return}
  modal('Modo gestor','Digite a senha para validar ações e editar o painel.','<input type="password" id="pw" placeholder="Senha" autocomplete="off" />','Entrar',()=>{
    if($('pw').value!==ADMIN_PASS){toast('Senha incorreta.');return false}
    admin=true;document.body.classList.add('admin');$('locki').className='ti ti-lock-open';$('lockt').textContent='Gestor ativo';renderAll();toast('Modo gestor ativo');
  });
}
function openReg(){
  modal('Registrar ação','A ação fica pendente até o gestor validar.',
  `<label>Participante</label><select id="rp"><option value="">Selecione...</option>${Object.keys(PL).map(k=>`<option value="${k}">${PL[k].n} (${esc(PL[k].a)})</option>`).join('')}</select>
   <label>Tipo de ação</label><select id="ra"><option value="">Selecione...</option>${Object.keys(ACT).map(k=>`<option value="${k}">${ACT[k].e} ${ACT[k].l} — ${ACT[k].p} pts</option>`).join('')}</select>
   <label>Link da intranet</label><input type="text" id="rl" placeholder="Cole o link aqui" /><div id="rw"></div>`,
  'Enviar para validação',async()=>{
    const k=$('rp').value,a=$('ra').value,l=$('rl').value.trim();

    if(!l){toast('Cole o link da intranet.');return false}

    await done('Ação enviada! Aguarde a validação.');
  });
  $('rl').addEventListener('input',()=>{const d=dupOf({link:$('rl').value,id:''});$('rw').innerHTML=d&&$('rl').value.trim().length>8?`<div class="warn"><i class="ti ti-alert-triangle"></i> Esse link já foi registrado por <b>${PL[d.k]?PL[d.k].n:''}</b> (${d.w}).</div>`:''});
}
async function validate(id){
  if(!admin)return;const it=S.pending.find(p=>String(p.id)===String(id));if(!it)return;
  try{await api('validate',{id:it.id,playerKey:it.playerKey,pts:it.pts,label:lbl(it)});await done('Ação validada!')}
  catch(e){toast(e.message);await load()}
}

}
function openZero(){if(!admin)return;modal('Zerar registros de hoje','Remove do histórico e estorna os pontos de todas as ações validadas hoje. Não dá para desfazer.','','Zerar hoje',async()=>{await api('zero-today',{});await done('Registros de hoje removidos!')},'dng')}
function openWeek(){if(!admin)return;modal('Encerrar semana','Salva o ranking e o histórico da semana e zera pontos, pendentes e negadas.','<input type="text" id="wl" placeholder="Nome da semana (ex.: Semana 1 · 02/06 a 06/06)" />','Encerrar e zerar',async()=>{const l=$('wl').value.trim();if(!l){toast('Digite o nome da semana.');return false}await api('close-week',{label:l});await done('Semana encerrada!')},'dng')}
function openMonth(){
  if(!admin)return;
  modal('Encerrar mês','Salva ranking, modalidades e receita do mês e <b>zera pontos, histórico, pendentes e receita diária</b>. Não dá para desfazer.',`<input type="text" id="ml" value="${esc(mname())}" />`,'Encerrar mês',async()=>{
    const l=$('ml').value.trim();if(!l){toast('Digite o nome do mês.');return false}
    const rk=Object.keys(PL).map(k=>({key:k,pts:Number(S.points[k])||0})).sort((a,b)=>b.pts-a.pts);
    await api('close-month',{label:l,counts:monthCounts(),receita:(S.dailyHistory||[]).reduce((s,d)=>s+Number(d.receita||0),0),meta:Number(S.metas.receita)||0,ranking:rk,closedAt:new Date().toISOString()});
    selMonth='cur';await done('Mês encerrado e zerado!');
  },'dng');
}
function openMetas(){
  if(!admin)return;
  modal('Metas','Defina as metas usadas nos indicadores.',`<label>Meta de receita do mês (R$)</label><input type="number" id="mr" min="0" value="${Number(S.metas.receita)||0}" /><label>Meta de pontos do time na semana</label><input type="number" id="mt2" min="0" value="${Number(S.metas.time)||0}" />`,'Salvar metas',async()=>{
    await api('update-metas',{metas:{receita:parseFloat($('mr').value)||0,time:parseInt($('mt2').value)||0}});await done('Metas salvas!');
  });
}
function openDay(){
  if(!admin)return;
  modal('Registrar resultado do dia','Informe a data e a receita do dia.',`<input type="date" id="dd" value="${new Date().toISOString().slice(0,10)}" /><input type="number" id="dv" min="0" placeholder="Receita do dia (R$)" />`,'Salvar',async()=>{
    const d=$('dd').value;if(!d){toast('Informe a data.');return false}
    await api('add-daily',{date:d,receita:parseFloat($('dv').value)||0});await done('Resultado salvo!');
  });
}
async function delDay(d){if(!admin)return;try{await api('remove-daily',{date:d});await done('Dia removido.')}catch(e){toast(e.message)}}
function openMotiv(){
  if(!admin)return;
  modal('Mensagem para o time','Aparece no topo do painel para todo mundo.',`<textarea id="mv" rows="3">${esc($('motiv').textContent)}</textarea>`,'Publicar',async()=>{
    const t=$('mv').value.trim();if(!t){toast('Digite uma mensagem.');return false}
    await api('update-motiv',{text:t});$('motiv').textContent=t;toast('Mensagem publicada!');
  });
}

/* ---------- contador ---------- */
function tick(){
  const n=new Date();let d=(5-n.getDay()+7)%7;const t=new Date(n);t.setDate(n.getDate()+d);t.setHours(18,0,0,0);if(t<=n)t.setDate(t.getDate()+7);
  const s=Math.floor((t-n)/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60,el=$('cd');
  el.textContent=dd>0?`${dd}d ${hh}h ${mm}m`:hh>0?`${hh}h ${mm}m ${ss}s`:`${mm}m ${ss}s`;
  el.className=(t-n)<86400000?'urg':'';
}
tick();setInterval(tick,1000);
load();setInterval(()=>load(),30000);
